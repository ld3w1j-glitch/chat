<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182224"><title>Entrar • Nossa Sala</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="home"><main class="card auth-card">
<div class="heart">💬</div><h1>Entrar</h1><p>Use a conta aprovada pelo administrador.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post" class="stack-form">
<label>Usuário<input name="username" autocomplete="username" required></label>
<label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
<button class="primary" type="submit">Entrar</button>
</form>
<div class="auth-links"><a href="{{ url_for('request_account') }}">Solicitar uma conta</a><a href="{{ url_for('index') }}">Voltar</a></div>
</main><script src="/static/common.js"></script></body></html>
