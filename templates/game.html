<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182224"><title>{{ game_info.name }} • Nossa Sala</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icons/icon-192.png"><link rel="apple-touch-icon" href="/static/icons/icon-192.png"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="app-shell game-shell">
<header class="app-header"><div class="header-profile"><a class="back-mini" href="{{ url_for('games_page') }}">‹</a><div class="game-header-icon">{{ game_info.icon }}</div><div><strong>{{ game_info.name }}</strong><div class="room-code">Partida privada • {{ game.code }}</div></div></div><div class="header-actions"><a class="secondary compact link-button" href="{{ url_for('games_page') }}">Jogos</a><button id="resignBtn" class="danger-btn compact" type="button">Desistir</button></div></header>
<div id="statusBar" class="status-bar hidden" role="status"></div>
<section class="game-content"><div id="gameStatus" class="game-turn-banner">Carregando...</div><section id="gameBoard" class="game-board-panel"></section><section class="game-side-panel"><section id="game-chat" class="panel-section game-chat-panel"><div class="section-title"><div><h2>💬 Chat da partida</h2><p>Privado entre os dois jogadores. As mensagens ficam salvas.</p></div></div><div id="gameChatMessages" class="game-chat-messages" aria-live="polite"></div><form id="gameChatForm" class="game-chat-form"><textarea id="gameChatInput" rows="1" maxlength="1200" placeholder="Mensagem sobre a partida..."></textarea><button id="gameChatSend" class="primary compact" type="submit">Enviar</button></form></section><div class="panel-section"><div class="section-title"><div><h2>Histórico da partida</h2><p>As jogadas ficam registradas.</p></div></div><div id="moveHistory" class="move-history"></div></div><button id="rematchBtn" class="primary hidden" type="button">Jogar revanche</button></section></section>
</main><script>window.GAME_CONFIG={{ {'code': game.code, 'user_id': user.id, 'game_type': game.game_type}|tojson }};</script><script src="/static/common.js"></script><script src="/static/game.js"></script></body></html>
